; Falcon Tracker firmware
;   pio run -e tx -t upload     falcon tag
;   pio run -e rx -t upload     base station
;   pio test -e native          protocol unit tests (runs on your PC)

[platformio]
default_envs = tx, rx

[esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 80000000L  ; plenty for this job, saves power
build_flags =
  -Wall
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  jgromes/RadioLib@7.1.2

[env:tx]
extends = esp32c3
build_src_filter = +<tx/>
build_flags = ${esp32c3.build_flags} -D DEVICE_ID=1
lib_deps =
  ${esp32c3.lib_deps}
  mikalhart/TinyGPSPlus@1.1.0

[env:rx]
extends = esp32c3
build_src_filter = +<rx/>

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
